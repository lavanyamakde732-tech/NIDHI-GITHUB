<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Landing Page</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Travel World</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Places</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2>Explore Beautiful Places</h2>

            <p>
                Travel with us and enjoy your dream vacation.
            </p>

            <button onclick="showMessage()">
                Explore Now
            </button>
        </div>
    </section>

    <section class="places">

        <h2>Popular Destinations</h2>

        <div class="cards">

            <div class="card">
                <h3>Goa</h3>
                <p>Beautiful beaches and fun nightlife.</p>
            </div>

            <div class="card">
                <h3>Manali</h3>
                <p>Snowy mountains and adventure trips.</p>
            </div>

            <div class="card">
                <h3>Kerala</h3>
                <p>Enjoy nature and peaceful backwaters.</p>
            </div>

        </div>

    </section>

    <footer>
        <p>© 2026 Travel Landing Page</p>
    </footer>

    <script src="script.js"></script>

</html>
